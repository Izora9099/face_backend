# docker compose up --build
# API on http://localhost:8000 (docs: /api/docs/), Postgres for data.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: faceit
      POSTGRES_USER: faceit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faceit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceit -d faceit"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://faceit:${POSTGRES_PASSWORD:-faceit}@db:5432/faceit
      SECRET_KEY: ${SECRET_KEY:-docker-dev-only-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SEED_DEMO: ${SEED_DEMO:-1}
    ports:
      - "8000:8000"
    volumes:
      - logs:/app/logs
      - backups:/app/backups
      - reports:/app/reports

volumes:
  pgdata:
  logs:
  backups:
  reports:
